name: Bucard UI smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Bucard site smoke checks
        env:
          BUCARD_BASE_URL: ${{ secrets.BUCARD_BASE_URL || 'https://bucard.az' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUCARD_TEST_USER: ${{ secrets.BUCARD_TEST_USER }}
          BUCARD_TEST_PASSWORD: ${{ secrets.BUCARD_TEST_PASSWORD }}
        run: mvn --batch-mode test

      - name: Upload test failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: target/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report --batch-mode

      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          if-no-files-found: ignore
          retention-days: 14
