name: Bucard UI smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Bucard site smoke checks
        env:
          BUCARD_BASE_URL: ${{ secrets.BUCARD_BASE_URL || 'https://bucard.az' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUCARD_TEST_USER: ${{ secrets.BUCARD_TEST_USER }}
          BUCARD_TEST_PASSWORD: ${{ secrets.BUCARD_TEST_PASSWORD }}
          ALLURE_REPORT_URL: https://bucard-tech.github.io/bucardwebauto/
        run: mvn --batch-mode test

      - name: Upload test failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: target/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate Allure Report and Visual Gallery
        if: always()
        run: |
          mvn allure:report --batch-mode
          cp scripts/gallery.css scripts/gallery.js target/site/allure-maven-plugin/
          python3 scripts/generate_gallery.py target/site/allure-maven-plugin
          python3 -c "
          with open('target/site/allure-maven-plugin/index.html', 'r', encoding='utf-8') as f:
              html = f.read()
          if 'gallery.css' not in html:
              html = html.replace('</head>', '    <link rel=\"stylesheet\" type=\"text/css\" href=\"gallery.css\">\n</head>')
          if 'gallery.js' not in html:
              html = html.replace('</body>', '    <script src=\"gallery.js\"></script>\n</body>')
          with open('target/site/allure-maven-plugin/index.html', 'w', encoding='utf-8') as f:
              f.write(html)
          "

      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          if-no-files-found: ignore
          retention-days: 14

      - name: Deploy Allure Report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/allure-maven-plugin/
          publish_branch: gh-pages
